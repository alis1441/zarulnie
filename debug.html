        MP3 и видео проверяются так же точно, как изображения; сеть не используется.

      <div class="vcard-cache-debug__actions">
        <button type="button" id="vcard-debug-check">Проверить локальный кэш</button>
        <button type="button" id="vcard-debug-snapshot" disabled>Сохранить снимок</button>
      </div>
      <p id="vcard-debug-status" class="vcard-cache-debug__status" aria-live="polite"></p>
      <p id="vcard-debug-session" class="vcard-cache-debug__status"></p>
      <dl id="vcard-debug-summary" class="vcard-cache-debug__summary"></dl>
    </header>

    <div class="vcard-cache-debug__table-wrap">
      <table>

            <th>Тип</th>

            <th>Размер</th>

            <th>В прошлом снимке</th>
          </tr>
        </thead>
        <tbody id="vcard-debug-resources"></tbody>

    </div>
